<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login_background">
        <div class="head">
            <div class="logo">
                <img src="/img/ByteStore_logo.svg" alt="ByteStore">
            </div>
            <div class="menu">
                <a href="../index.html">Главная</a>
                <a href="/pages/catalog.html">Каталог</a>
                <a href="#builder">Сборка ПК</a>
                <a href="#about">О нас</a>
            </div>
            <div class="search">
                <input type="text">
                <img src="/img/Search_alt_fill.png" alt="search">
            </div>
            <div class="login">
                <a href="/pages/login.html"><img src="/img/login.svg" alt="login"></a>
            </div>
            <div class="cart">
                <a href="/pages/cart.html"><img src="/img/Basket.svg" alt=""></a>
            </div>
        </div>
        <div class="main_login">
            <div class="login_logo">
                <img src="/img/ByteStore_logo.svg" alt="">
            </div>
            <div class="login_text">
                <h1>Войти в Bystore</h1>
                <p>Войдите в свой аккаунт, чтобы отслеживать заказы и управлять ими</p>
            </div>
            <div class="login_input">
                <input type="email" placeholder="Ваш email">
                <input type="password" placeholder="Пароль">
            </div>
            <div class="login_button">
                <div class="login_button1">
                    <button>Войти →</button>
                </div>
                <div class="login_button2">
                    <button>Регистрация →</button>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
