<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — ByteStore</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <div class="login_background">

        <div class="head">

            <div class="logo">
                <a href="../index.html">
                    <img src="../img/ByteStore_logo.svg" alt="ByteStore">
                </a>
            </div>

            <div class="menu">
                <a href="../index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="../index.html#builder">Сборка ПК</a>
                <a href="../index.html#about">О нас</a>
            </div>

            <div class="search">
                <input type="text">
                <img src="../img/Search_alt_fill.png" alt="Поиск">
            </div>

            <div class="login">
                <a href="login.html">
                    <img src="../img/login.svg" alt="Вход">
                </a>
            </div>

            <div class="cart">
                <a href="cart.html">
                    <img src="../img/Basket.svg" alt="Корзина">
                </a>
            </div>

        </div>

        <div class="main_login">

            <div class="login_logo">
                <img src="../img/ByteStore_logo.svg" alt="ByteStore">
            </div>

            <div class="login_text">
                <h1>Войти в ByteStore</h1>
                <p>
                    Войдите в свой аккаунт, чтобы отслеживать
                    заказы и управлять ими
                </p>
            </div>

            <div class="login_input">
                <input type="email" placeholder="Ваш email">
                <input type="password" placeholder="Пароль">
            </div>

            <div class="login_button">

                <div class="login_button1">
                    <button type="button">Войти →</button>
                </div>

                <div class="login_button2">
                    <button type="button">Регистрация →</button>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
